name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Install CocoaPods dependencies
        run: |
          pod install --repo-update || pod install
          ls -la

      - name: Dump AMapNavi headers
        run: |
          echo "===== DriveManager ====="
          grep -nE "DataReviewer|SingleNaviView|calculateDriveRoute|startNavi|stopNavi|pauseNavi|resumeNavi|sharedInstance|destroyInstance" Pods/AMapNavi/AMapNaviKit.framework/Headers/AMapNaviDriveManager.h
          echo "===== Delegate ====="
          grep -nE "onCalculateRoute|driveManager.*error|onNavi|onArrived" Pods/AMapNavi/AMapNaviKit.framework/Headers/AMapNaviDriveManager.h
          echo "===== DriveView ====="
          grep -nE "@interface|initWithFrame|AMapNaviDriveDataReviewer" Pods/AMapNavi/AMapNaviKit.framework/Headers/AMapNaviDriveView.h
          echo "===== Enums ====="
          grep -nE "typedef NS_ENUM|AMapNaviDrivingStrategy|AMapNaviType|AMapNaviRoutePlanType" Pods/AMapNavi/AMapNaviKit.framework/Headers/AMapNaviCommonObj.h
          grep -nE "AMapNaviDrivingStrategy|strategySpeed|AMapNaviTypeGPS" Pods/AMapNavi/AMapNaviKit.framework/Headers/*.h | head -40
          echo "===== 3DMap accuracy ====="
          grep -rn "ccuracyRing" Pods/AMap3DMap/MAMapKit.framework/Headers/ | head

      - name: Build (unsigned)
        run: |
          xcodebuild -workspace MotoCarPlay.xcworkspace \
            -scheme MotoCarPlay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign for TrollStore
        run: |
          find build/Build/Products -name "*.app" -maxdepth 3 -print
          APP=build/Build/Products/Release-iphoneos/MotoCarPlay.app
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || echo "ad-hoc sign skipped"
          /usr/bin/codesign -dv "$APP" 2>&1 || true

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MotoCarPlay.app Payload/
          zip -qry MotoCarPlay-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoCarPlay-unsigned
          path: MotoCarPlay-unsigned.ipa
