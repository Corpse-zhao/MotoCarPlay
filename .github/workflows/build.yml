name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Install CocoaPods dependencies
        run: |
          pod install --repo-update || pod install
          ls -la

      - name: Dump AMapNavi headers
        run: |
          echo "===== AMapNavi version ====="
          grep -rn "AMapNavi (" Podfile.lock | head -5

      - name: Build (unsigned)
        run: |
          xcodebuild -workspace MotoCarPlay.xcworkspace \
            -scheme MotoCarPlay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign for TrollStore
        run: |
          find build/Build/Products -name "*.app" -maxdepth 3 -print
          APP=build/Build/Products/Release-iphoneos/MotoCarPlay.app
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP" || echo "ad-hoc sign skipped"
          /usr/bin/codesign -dv "$APP" 2>&1 || true

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MotoCarPlay.app Payload/
          zip -qry MotoCarPlay-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoCarPlay-unsigned
          path: MotoCarPlay-unsigned.ipa
