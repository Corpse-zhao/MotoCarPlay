name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build (unsigned)
        run: |
          xcodebuild -project MotoCarPlay.xcodeproj \
            -scheme MotoCarPlay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign for TrollStore
        run: |
          APP=build/Build/Products/Release-iphoneos/MotoCarPlay.app
          ls -la "$APP"
          /usr/bin/codesign --force --sign - --timestamp=none "$APP" || echo "ad-hoc sign skipped"
          /usr/bin/codesign -dv "$APP" 2>&1 || true

      - name: Package unsigned .app
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MotoCarPlay.app Payload/
          zip -qry MotoCarPlay-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoCarPlay-unsigned
          path: MotoCarPlay-unsigned.ipa
