name: MotoCarPlay
options:
  bundleIdPrefix: com.corpsezhao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  MotoCarPlay:
    type: application
    platform: iOS
    sources:
      - path: MotoCarPlay
        excludes:
          - Info.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
    info:
      path: MotoCarPlay/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: 摩托CarPlay
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "17"
        NSLocationWhenInUseUsageDescription: 需要定位以显示车速、航向和骑行导航。
        NSLocationAlwaysAndWhenInUseUsageDescription: 骑行中持续显示车速和导航指引。
        NSAppleMusicUsageDescription: 需要读取系统正在播放的音乐，以便在车机界面上显示和控制。
        NSContactsUsageDescription: 需要读取通讯录，以便在车机界面上选择联系人拨打电话。
        LSRequiresIPhoneOS: true
        LSApplicationQueriesSchemes:
          - iosamap
          - baidumap
          - qqmap
          - amapuri
          - music
          - orpheus
          - qqmusic
          - spotify
          - kugou
          - qishui
          - snssdk1128
          - douyinlite
        UIBackgroundModes:
          - audio
          - location
        UIRequiresFullScreen: true
        # 状态栏交给视图控制器决定，才能在运行时切换（设置里"显示系统状态栏"）
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        MinimumOSVersion: "16.0"
